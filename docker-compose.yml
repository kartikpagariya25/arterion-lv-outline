services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - DATA_DIR=/data
      - UPLOAD_DIR=/data/uploads
      - JWT_SECRET=${JWT_SECRET:-}
      - DOCTOR_INVITE_CODE=${DOCTOR_INVITE_CODE:-}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-}
    volumes:
      - ./backend/app/lv_outline/weights:/srv/app/lv_outline/weights:ro
      - data:/data
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  data:
